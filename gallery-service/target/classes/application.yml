server:
  port: 8083

spring:
  application:
    name: GALLERY-SERVICE
  cloud:
    gcp:
      core:
        enabled: false
      storage:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/tripdiary_gallery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Ijse@1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Custom properties for local testing fallback
app:
  gallery:
    upload-dir: uploads/
    use-gcs: false # Set to true when GCP credentials are provided
    gcs-bucket: your-gcs-bucket-name
