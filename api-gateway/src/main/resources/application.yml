server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route 1: Profile Service
        - id: profile-service
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/profiles/**

        # Route 2: Destination Service (Destinations & Blogs)
        - id: destination-service
          uri: lb://DESTINATION-SERVICE
          predicates:
            - Path=/api/destinations/**, /api/blogs/**

        # Route 3: Photo Gallery Service
        - id: gallery-service
          uri: lb://GALLERY-SERVICE
          predicates:
            - Path=/api/gallery/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173" # React frontend default port
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
